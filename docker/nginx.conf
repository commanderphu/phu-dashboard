server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-Page-Anwendung: unbekannte Pfade wie /briefing oder /verkehr
    # gibt es als Datei nicht — der Router im Browser übernimmt.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Die Laufzeit-Konfiguration darf nie zwischengespeichert werden, sonst
    # bekäme ein Container mit neuer API_URL die alte Adresse ausgeliefert.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Vite hängt an Bündel einen Hash an — die dürfen lange liegen bleiben.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
